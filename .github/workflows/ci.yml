name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: build release
        run: cargo build --release

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: service-limiter-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: service-limiter-linux-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: service-limiter-windows-x86_64.zip
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The aarch64 build needs its target installed. Without this,
          # `cargo build --target aarch64-unknown-linux-gnu` fails with
          # "can't find crate for core".
          targets: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/service-limiter.exe pkg/
          else
            cp target/${{ matrix.target }}/release/service-limiter pkg/
          fi
          cp LICENSE README.md pkg/ 2>/dev/null || true
          # The archive lands in the workspace root, next to the checksum.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${{ matrix.asset }}" ./pkg/*
          else
            tar -czf "${{ matrix.asset }}" -C pkg .
          fi
      - name: Checksum
        shell: bash
        run: sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - name: Prepare release notes
        shell: bash
        run: |
          # The release body is the changelog section for this tag, never the
          # whole file and never GitHub's auto-generated notes.
          #
          # index(), not a regex: the awk program below is inside single
          # quotes, so "\[" is an escaped backslash followed by an unclosed
          # character class and awk refuses to parse it.
          SECTION="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            index($0, "## [" tag "]") == 1 { found=1 }
            found && index($0, "## [") == 1 && index($0, "## [" tag "]") != 1 { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$SECTION" ]; then
            echo "::error::No '## [${GITHUB_REF_NAME#v}]' section in CHANGELOG.md"
            exit 1
          fi
          # Safe: "$SECTION" is a variable, so the backticks in the changelog
          # are never re-evaluated by the shell.
          printf '%s\n' "$SECTION" > RELEASE_NOTES.md
          # A tag with a pre-release suffix publishes as a pre-release. Every
          # version goes out as a pre-release first and is promoted to stable
          # only after it has been tested.
          if printf '%s' "${GITHUB_REF_NAME#v}" | grep -Eq -- '-(rc|beta|alpha)[0-9.]*$'; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ env.PRERELEASE }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
