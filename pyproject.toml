[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "service-limiter"
version = "0.1.0"
description = "Cross-platform service resource limiter"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]
keywords = ["windows", "linux", "services", "resource", "limiting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "psutil>=5.9.0",
]

[tool.setuptools]
packages = [
    "service_limiter",
    "service_limiter.cli",
    "service_limiter.models",
    "service_limiter.platform",
]

[tool.setuptools.package-data]
service_limiter = ["profiles/*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=5.0.0",
]

[project.scripts]
service-limiter = "service_limiter.cli.main:main"
