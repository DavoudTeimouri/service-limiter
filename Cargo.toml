[package]
name = "service-limiter"
version = "2.0.0"
edition = "2021"
rust-version = "1.77"
description = "Cross-platform service resource limiter (Linux systemd / Windows Job Objects)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DavoudTeimouri/service-limiter"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dependencies.tempfile]
version = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
