[package]
name = "service-limiter"
version = "2.1.0-rc.1"
edition = "2021"
rust-version = "1.77"
description = "Cross-platform service resource limiter (Linux systemd / Windows Job Objects)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DavoudTeimouri/service-limiter"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# NOTE: no windows-sys dependency. The Windows path shells out to PowerShell
# (src/job_limits.ps1), which calls the Win32 Job Object APIs itself through
# Add-Type. Pulling in windows-sys would add a large dependency tree for
# nothing.

[dependencies.tempfile]
version = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
